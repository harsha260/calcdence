name: Release Android APK

on:
  push:
    tags:
      - 'v*' # Triggers on tags starting with 'v', e.g., v0.6.0
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write # Important: required to create GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x' # Keep this somewhat close to your SDK constraints or leave 'channel: stable'
          channel: 'stable'

      - name: Create .env file for build
        run: |
          echo "CAMPX_API_BASE_URL=https://anits.campx.in" > .env
          echo "GITHUB_REPO=${{ github.repository }}" >> .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
